<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LineAR – Concept B</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #main-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #video-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    #p5-container {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 2;
      width: 100%;
      height: 100%;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <video id="video-input" width="1280" height="720" playsinline autoplay muted></video>
  <canvas id="main-canvas"></canvas>
  <div id="p5-container"></div>

  <!-- No OpenCV — camera-free wizard-of-oz demo with hand tracking for basis vectors -->
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
