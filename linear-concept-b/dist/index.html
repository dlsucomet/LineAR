<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LineAR – Concept B</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #main-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #video-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    #p5-container {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 2;
      width: 100%;
      height: 100%;
      opacity: 0.75;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BMtg7z_v.js"></script>
</head>

<body>
  <video id="video-input" width="1920" height="1080" playsinline autoplay muted></video>
  <canvas id="main-canvas"></canvas>
  <div id="p5-container"></div>

  <script async src="https://docs.opencv.org/4.x/opencv.js"
    onload="console.log('[LineAR] OpenCV.js ready.')"
    onerror="console.error('[LineAR] Failed to load OpenCV.js from CDN.'); window.__opencvFailed = true"></script>

  <!-- Pure-JS ArUco: marker generation -->
  <script async src="https://cdn.jsdelivr.net/npm/aruco-marker@3.0.1/dist/aruco-marker.umd.js"
    onload="console.log('[LineAR] aruco-marker ready.')"
    onerror="console.error('[LineAR] Failed to load aruco-marker.'); window.__arucoMarkerFailed = true"></script>

  <!-- Pure-JS ArUco: detection (jcmellado/js-aruco, MIT) -->
  <script src="/src/../public/js-aruco/cv.js"></script>
  <script src="/src/../public/js-aruco/aruco.js"></script>

  <script>console.log("[LineAR] HTML loaded, about to fetch module…");</script>
</body>

</html>
