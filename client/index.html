<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineAR - Training System Core</title>
    <link rel="stylesheet" href="LineAR.css">
</head>
<body>

    <div class="header-banner">Place paper on the blue area</div>
    <div id="status" class="status-badge">System Status: Booting...</div>

    <div class="app-container">
        
        <div class="panel left-panel">
            <div class="panel-title">Geometric Space Visualizer</div>
            <canvas id="graphCanvas"></canvas>
        </div>

        <div class="panel right-panel">
            <video id="webcamFeed" autoplay playsinline></video>
            <canvas id="arOverlay"></canvas>
        </div>

    </div>

    <div class="control-panel">
        <button class="action-btn" onclick="triggerValidationPass()">Verify Steps</button>
        <button class="action-btn exit-btn" onclick="window.close()">Exit</button>
    </div>

    <script src="LineAR.js"></script>
</body>
</html>
